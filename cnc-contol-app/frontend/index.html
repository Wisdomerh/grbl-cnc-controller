<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Control App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <h1>CNC Control App</h1>
        <div id="connection-panel">
            <input type="text" id="port-input" placeholder="Enter COM port (e.g., COM3)">
            <button id="connect-btn">Connect</button>
            <button id="disconnect-btn">Disconnect</button>
        </div>
        <div id="control-panel">
            <button id="reset-btn">Reset</button>
            <button id="home-btn">Home</button>
            <div id="jog-panel">
                <h3>Jog Controls</h3>
                <div class="jog-buttons">
                    <button class="jog-btn" data-axis="y" data-direction="1">Y+</button>
                    <button class="jog-btn" data-axis="x" data-direction="-1">X-</button>
                    <button class="jog-btn" data-axis="z" data-direction="1">Z+</button>
                    <button class="jog-btn" data-axis="x" data-direction="1">X+</button>
                    <button class="jog-btn" data-axis="y" data-direction="-1">Y-</button>
                    <button class="jog-btn" data-axis="z" data-direction="-1">Z-</button>
                </div>
            </div>
        </div>
        <div id="gcode-panel">
            <h3>G-code Control</h3>
            <input type="file" id="gcode-file-input" accept=".nc,.gcode">
            <p id="file-path"></p>
            <textarea id="gcode-input" rows="10" cols="50" placeholder="Enter G-code here"></textarea>
            <button id="send-gcode-btn">Send G-code</button>
        </div>
        <div id="visualizer">
            <!-- 3D visualizer will be added here -->
        </div>
        <div id="status-panel">
            <h3>Status</h3>
            <p id="status-display">Not connected</p>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
