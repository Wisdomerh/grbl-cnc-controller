<!-- splash.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart CNC Control - Loading</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #2a2a2a;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    
    .splash-container {
      text-align: center;
      max-width: 500px;
      padding: 2rem;
    }
    
    .logo {
      width: 180px;
      height: 180px;
      margin-bottom: 2rem;
      animation: pulse 2s infinite ease-in-out;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #3498db;
    }
    
    .loading-text {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #bbb;
    }
    
    .progress-container {
      width: 100%;
      height: 10px;
      background-color: #444;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    
    .progress-bar {
      height: 100%;
      width: 10%;
      background-color: #3498db;
      border-radius: 5px;
      animation: progressAnimation 3s ease-in-out forwards;
    }
    
    .status-text {
      font-size: 0.9rem;
      color: #999;
      height: 20px;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    @keyframes progressAnimation {
      0% { width: 10%; }
      50% { width: 65%; }
      70% { width: 85%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="../src/assets/icon-cnc.ico" alt="CNC Control Logo" class="logo">
    <h1>Smart CNC Control</h1>
    <div class="loading-text">Initializing system components...</div>
    <div class="progress-container">
      <div class="progress-bar" id="loading-progress"></div>
    </div>
    <div class="status-text" id="status-message">Loading components...</div>
  </div>

  <script>
    // Array of loading messages to display
    const loadingMessages = [
      "Loading components...",
      "Initializing serial interface...",
      "Setting up visualizer...",
      "Loading CAD engine...",
      "Preparing workspace...",
      "Connecting to server...",
      "Ready to launch"
    ];
    
    let currentIndex = 0;
    const statusElement = document.getElementById('status-message');
    const progressBar = document.getElementById('loading-progress');
    
    // Change messages at intervals
    function updateLoadingMessage() {
      if (currentIndex < loadingMessages.length) {
        statusElement.textContent = loadingMessages[currentIndex];
        
        // Update progress bar
        const progressPercentage = (currentIndex + 1) / loadingMessages.length * 100;
        progressBar.style.width = `${progressPercentage}%`;
        
        currentIndex++;
        
        if (currentIndex < loadingMessages.length) {
          setTimeout(updateLoadingMessage, 800);
        } else {
          // Launch main application when loading completes
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
      }
    }
    
    // Start the loading sequence
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(updateLoadingMessage, 1000);
    });
  </script>
</body>
</html>
